<!doctype html>
<html lang="fil" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8ed" />
    <link
      rel="icon"
      type="image/png"
      href="/assets/brand/kwentohabi-logo-warm.png"
    />
    <link
      rel="apple-touch-icon"
      href="/assets/brand/kwentohabi-logo-warm.png"
    />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("kwentohabi-theme");
        } catch {}
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#1c130f" : "#fff8ed";
      })();
    </script>
    <title>KwentoHabi - AI Collaborative Writing &amp; Continuity Engine</title>
    <meta
      name="description"
      content="An AI-powered classroom writing platform for Filipino students that checks narrative continuity, resolves cross-author contradictions, and maintains a safe, teacher-controlled story space."
    />
    <meta
      property="og:title"
      content="KwentoHabi - AI Collaborative Writing &amp; Continuity Engine"
    />
    <meta
      property="og:description"
      content="An AI-powered classroom writing platform for Filipino students that checks narrative continuity, resolves cross-author contradictions, and maintains a safe, teacher-controlled story space."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700;800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
